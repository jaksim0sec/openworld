name: Verify static environment study
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify.mjs
      - run: node tools/color.test.mjs
      - run: node --check movement.js
      - run: node --test tests/movement.test.cjs
