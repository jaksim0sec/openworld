<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#81cbd2;color:white;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.name{position:fixed;top:clamp(14px,3vw,30px);left:clamp(16px,3vw,32px);pointer-events:none;text-shadow:0 2px 10px #183f4777}.name small{font-size:10px;letter-spacing:.25em}.name h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(25px,3.5vw,42px);font-weight:500;letter-spacing:-.06em;margin:4px 0}.name p{font-size:11px;margin:0;opacity:.86}.views{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#163f4499;border:1px solid #ffffff55;backdrop-filter:blur(12px);display:flex;padding:5px;gap:3px;border-radius:999px;box-shadow:0 8px 22px #294c4f33}.views button{background:transparent;border:0;color:white;border-radius:100px;padding:0 13px;min-height:38px;font:600 12px system-ui;touch-action:manipulation;white-space:nowrap;cursor:pointer}.views button.active{background:#ffedc0;color:#284e57}#stats{position:fixed;right:12px;top:12px;font:600 10px monospace;text-shadow:0 2px 5px #1a4b51;pointer-events:none}#err{display:none;position:fixed;left:8%;right:8%;top:30%;padding:18px;border-radius:10px;background:#233f44ee;white-space:pre-wrap}#err.show{display:block}#tip{position:fixed;right:12px;bottom:78px;font-size:10px;text-shadow:0 2px 6px #22525c;pointer-events:none}

<canvas id="world" aria-label="에테르 들판 3D 풍경"></canvas>
<div class="name"><small>SERENVELT / ENVIRONMENT STUDY 01</small><h1>에테르 들판</h1><p>바람과 빛이 머무는 초원</p></div>
<div id="stats">WEBGL2 · STARTING</div><div id="tip">드래그 · 둘러보기</div>
<nav class="views" aria-label="풍경 선택"><button data-scene="0" class="active">초원</button><button data-scene="1">숲</button><button data-scene="2">절벽</button><button id="quality">화질 · 보통</button></nav>

<script type="x-shader/x-vertex" id="sky-vs">#version 300 es
precision highp float;
void main(){vec2 p=gl_VertexID==0?vec2(-1.,-1.):gl_VertexID==1?vec2(3.,-1.):vec2(-1.,3.);gl_Position=vec4(p,0.,1.);}
</script>
<script type="x-shader/x-fragment" id="sky-fs">#version 300 es
precision highp float;
out vec4 frag;
uniform vec3 uForward,uRight,uUp,uSun;
uniform vec2 uSize;
uniform float uFov,uTime;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float cloud(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+vec2(13.,8.);a*=.5;}return s;}
void main(){
vec2 uv=gl_FragCoord.xy/uSize*2.-1.;
vec3 d=normalize(uForward+uRight*uv.x*uFov*uSize.x/uSize.y+uUp*uv.y*uFov);
float elevation=max(0.,d.y);
vec3 sky=mix(vec3(.65,.84,.78),vec3(.065,.48,.77),pow(elevation,.59));
float sun=max(0.,dot(d,uSun));
sky+=vec3(1.,.74,.46)*exp(-elevation*13.)*.065+vec3(1.,.78,.5)*pow(sun,21.)*.075;
vec2 p=d.xz/(max(.03,d.y)+.19)*1.5+vec2(uTime*.008,0.);
float density=cloud(p*.82)+.14*noise(p*2.1);
float cover=smoothstep(.46,.62,density)*smoothstep(.015,.13,d.y);
float light=clamp(.59+(density-cloud(p*.82+uSun.xz*.23))*2.2,0.,1.);
vec3 cumulus=mix(vec3(.60,.72,.75),vec3(1.,.976,.86),light);
sky=mix(sky,cumulus,cover*.92);
sky+=vec3(1.,.86,.55)*pow(sun,700.)*.45;
frag=vec4(clamp(sky,0.,1.),1.);
}
</script>
<script type="x-shader/x-vertex" id="world-vs">#version 300 es
precision highp float;
layout(location=0) in vec3 pos;
layout(location=1) in vec3 normal;
layout(location=2) in vec3 color;
uniform vec3 uCam,uForward,uRight,uUp;
uniform float uFov,uAspect,uKind,uTime;
out vec3 vWorld,vNormal,vColor;
void main(){
vec3 p=pos;
if(uKind>1.5)p.xz+=vec2(.10,.065)*sin(uTime*.93+pos.x*.17+pos.z*.12)*clamp(normal.y,0.,1.);
vWorld=p;vNormal=normal;vColor=color;
vec3 delta=p-uCam;float depth=dot(delta,uForward);
gl_Position=vec4(dot(delta,uRight)/(uFov*uAspect),dot(delta,uUp)/uFov,depth*1.00023-.14,depth);
}
</script>
<script type="x-shader/x-fragment" id="world-fs">#version 300 es
precision highp float;
in vec3 vWorld,vNormal,vColor;
out vec4 frag;
uniform vec3 uCam,uSun;
uniform float uKind,uTime;
float hash(vec2 p){return fract(sin(dot(floor(p),vec2(127.1,311.7)))*43758.5453);}
void main(){
float light=max(dot(normalize(vNormal),uSun),0.);
vec3 c=vColor*(.75+.27*light);
if(uKind>.5&&uKind<1.5){float wave=sin(vWorld.z*.42+uTime*1.3)*sin(vWorld.x*1.5-uTime*.7);c=mix(vec3(.13,.45,.54),vec3(.39,.73,.72),.5+.45*wave);}
else c+=(hash(vWorld.xz*1.6)-.5)*.023;
float distanceFromCamera=distance(vWorld,uCam);
float atmosphere=1.-exp(-pow(distanceFromCamera*.0039,1.24));
c=mix(c,vec3(.56,.78,.79),clamp(atmosphere,0.,.83));
frag=vec4(clamp(c,0.,1.),1.);
}
</script>
<script>
(function(){
'use strict';
var canvas=document.getElementById('world'),error=document.getElementById('err'),stats=document.getElementById('stats');
var gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:true,powerPreference:'high-performance'});
if(!gl){error.className='show';error.textContent='WebGL2를 사용할 수 없음\nChrome 또는 WebGL2 지원 브라우저로 열어주세요';return;}
var TAU=Math.PI*2;
function hash(x){var y=Math.sin(x*127.1+71.7)*43758.5453;return y-Math.floor(y);}
function mix(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function smooth(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function river(z){return -32+Math.sin(z*.022)*13+Math.sin(z*.006)*12;}
function terrain(x,z){
return 1.1+.48*Math.sin(x*.028+z*.011)+.39*Math.cos(z*.033-x*.01)+
.17*Math.sin(x*.105+z*.036)*Math.cos(z*.086)+
smooth(110,290,z)*(7*Math.sin(x*.013+z*.01)+8*Math.cos(z*.014-x*.004))+
smooth(50,140,x)*smooth(45,180,z)*(5+6*Math.sin(z*.023+x*.008))-
(1-smooth(6,23,Math.abs(x-river(z))))*2.9;
}
function vecminus(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function normal(a,b,c){var u=vecminus(b,a),v=vecminus(c,a);var n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];var l=Math.hypot(n[0],n[1],n[2])||1;return n.map(function(q){return q/l;});}
function Batch(){this.values=[];this.triangles=0;}
Batch.prototype.tri=function(a,b,c,co){
var n=normal(a,b,c),v=this.values;
[a,b,c].forEach(function(p){v.push(p[0],p[1],p[2],n[0],n[1],n[2],co[0],co[1],co[2]);});
this.triangles++;
};
Batch.prototype.quad=function(a,b,c,d,co){this.tri(a,b,c,co);this.tri(a,c,d,co);};
Batch.prototype.upload=function(){
var v=new Float32Array(this.values),vao=gl.createVertexArray(),buffer=gl.createBuffer();
gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,v,gl.STATIC_DRAW);
for(var i=0;i<3;i++){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,3,gl.FLOAT,false,36,i*12);}
gl.bindVertexArray(null);this.count=v.length/9;this.vao=vao;this.values=null;return this;
};
var land=new Batch(),trees=new Batch(),water=new Batch(),grass=new Batch();
function makeGround(){
var step=5;
for(var z=-95;z<350;z+=step)for(var x=-220;x<220;x+=step){
var a=[x,terrain(x,z),z],b=[x,terrain(x,z+step),z+step],c=[x+step,terrain(x+step,z+step),z+step],d=[x+step,terrain(x+step,z),z];
var light=.5+.5*Math.sin(x*.02+z*.016);
var co=[.32+.12*light,.47+.19*light,.27+.05*light];
land.quad(a,b,c,d,co);
}
for(var zi=-95;zi<350;zi+=2){
var r=river(zi),r2=river(zi+2),w=6.4+1.2*Math.sin(zi*.05);
water.quad([r-w,-.27,zi],[r2-w,-.27,zi+2],[r2+w,-.27,zi+2],[r+w,-.27,zi],[.3,.66,.68]);
}
}
function mesa(cx,cz,rx,rz,h,seed){
var parts=64,ring=[];
for(var j=0;j<5;j++){
var row=[],t=j/4;
for(var i=0;i<=parts;i++){
var a=i/parts*TAU,r=(1.05-t*.18)*(1+.11*Math.sin(5*a+seed)+.065*Math.sin(13*a+seed*3));
row.push([cx+Math.cos(a)*rx*r,terrain(cx,cz)+t*h+.65+t*.9*Math.sin(a*3+seed),cz+Math.sin(a)*rz*r]);
}ring.push(row);
}
for(var k=0;k<4;k++)for(var m=0;m<parts;m++){
var shade=.77+.23*hash(m*3+k*17+seed);
land.quad(ring[k][m],ring[k][m+1],ring[k+1][m+1],ring[k+1][m],[.40*shade,.47*shade,.46*shade]);
}
for(var t=0;t<parts;t++)land.tri([cx,terrain(cx,cz)+h+.8,cz],ring[4][t],ring[4][t+1],[.42,.57,.31]);
}
function branch(points,radius,seed){
var rings=[];
for(var i=0;i<points.length;i++){
var row=[];
for(var j=0;j<=9;j++){
var a=j/9*TAU,r=radius[i]*(.9+.1*hash(seed+i*11+j*9));
row.push([points[i][0]+Math.cos(a)*r,points[i][1],points[i][2]+Math.sin(a)*r]);
}rings.push(row);
}
for(var k=0;k<rings.length-1;k++)for(var n=0;n<9;n++)
trees.quad(rings[k][n],rings[k+1][n],rings[k+1][n+1],rings[k][n+1],[.28,.255,.20]);
}
function leafVolume(x,y,z,rx,ry,rz,seed,pink){
var rings=[],N=13,M=8;
for(var j=0;j<=M;j++){
var phi=j/M*Math.PI,row=[];
for(var i=0;i<=N;i++){
var a=i/N*TAU,r=Math.sin(phi)*(1+.13*Math.sin(a*5+seed)+.06*Math.sin(a*9+phi*3+seed));
row.push([x+rx*r*Math.cos(a),y+ry*Math.cos(phi)-.18*Math.sin(a*2+seed)*r,z+rz*r*Math.sin(a)]);
}rings.push(row);
}
for(var k=0;k<M;k++)for(var m=0;m<N;m++){
var sun=.5+.5*Math.cos(k/M*Math.PI);
var shade=.87+.13*hash(seed+k*12+m*3);
var col=pink?[.72+.16*sun,.44+.24*sun,.57+.23*sun]:[.14+.23*sun,.29+.32*sun,.18+.20*sun];
trees.quad(rings[k][m],rings[k+1][m],rings[k+1][m+1],rings[k][m+1],col.map(function(q){return q*shade;}));
}
}
function tree(x,z,size,seed,pink,extraHeight){
var ground=terrain(x,z)+(extraHeight||0),h=(7+hash(seed)*3)*size,lean=(hash(seed+1)-.5)*size*2;
var p0=[x,ground,z],p1=[x+lean*.2,ground+h*.3,z+.15*size],p2=[x+lean*.6,ground+h*.63,z+.3*size],p3=[x+lean,ground+h*.82,z+.4*size];
branch([p0,p1,p2,p3],[.65,.48,.30,.055].map(function(v){return v*size;}),seed);
for(var i=0;i<5;i++){
var angle=i/5*TAU+seed,range=(3.5+hash(i+seed)*2)*size;
var mid=[mix(p1[0],x+Math.cos(angle)*range+lean,.48),ground+h*.61,z+Math.sin(angle)*range*.5];
var tip=[x+Math.cos(angle)*range+lean,ground+h*(.65+.08*hash(seed+i)),z+Math.sin(angle)*range];
branch([p1,mid,tip],[.26,.17,.026].map(function(v){return v*size;}),seed+i+11);
}
for(var j=0;j<18;j++){
var ang=j*2.39996+seed,rad=Math.sqrt((j+.5)/18),cx=x+lean+Math.cos(ang)*rad*4.2*size,cz=z+.4*size+Math.sin(ang)*rad*3.8*size;
leafVolume(cx,ground+h*.79+(1.2-rad*1.8)*size,cz,(2.15+.6*hash(j+seed))*size,(1.5+.45*hash(j+6))*size,2.0*size,seed+j*4,pink);
}
}
function stones(x,z,scale,seed){
var rings=[],n=9;
for(var j=0;j<=4;j++){
var a=j/4*Math.PI,row=[];
for(var i=0;i<=n;i++){
var q=i/n*TAU,r=Math.sin(a)*(.78+.2*hash(i*7+j*9+seed));
row.push([x+Math.cos(q)*r*scale,terrain(x,z)+Math.cos(a)*scale*.62+scale*.37,z+Math.sin(q)*r*scale]);
}rings.push(row);
}
for(var k=0;k<4;k++)for(var m=0;m<n;m++){
var v=.77+.22*hash(m*13+k*7+seed);
trees.quad(rings[k][m],rings[k+1][m],rings[k+1][m+1],rings[k][m+1],[.45*v,.51*v,.45*v]);
}
}
function flowers(){
for(var i=0;i<9000;i++){
var x=-110+hash(i*19)*240,z=-40+hash(i*31)*220;
if(Math.abs(x-river(z))<11)continue;
var y=terrain(x,z),height=.25+hash(i*47)*.54,width=.08+hash(i*71)*.15,a=hash(i*83)*TAU;
var dx=Math.cos(a)*width,dz=Math.sin(a)*width;
var color=[.37+.25*hash(i*7),.54+.2*hash(i*23),.20+.09*hash(i*11)];
grass.tri([x-dx,y,z-dz],[x+dx,y,z+dz],[x+dx*.2,y+height,z+dz*.2],color);
grass.tri([x+dz,y,z-dx],[x-dz,y,z+dx],[x-dz*.2,y+height,z+dx*.2],color);
}
}
function populate(){
makeGround();mesa(-87,158,54,40,28,14);mesa(111,248,87,46,35,7);
tree(24,80,1.6,21,false,0);tree(55,105,.88,32,false,0);
tree(-11,115,.87,17,true,0);tree(68,78,.7,7,false,0);
for(var i=0;i<22;i++){
var x=-150+hash(i+33)*310,z=20+hash(i+98)*200;
if(Math.abs(x-river(z))<15||Math.hypot(x-24,z-80)<25)continue;
tree(x,z,.35+.33*hash(i+9),i*13+6,false,0);
}
for(var j=0;j<12;j++){
var a=j*2.39996,rad=Math.sqrt((j+.5)/13),x=-87+Math.cos(a)*39*rad,z=158+Math.sin(a)*29*rad;
tree(x,z,.3+.15*hash(j+4),j+101,false,28);
}
for(var q=0;q<45;q++){
var xx=-150+hash(q*17+3)*320,zz=-45+hash(q*23+5)*210;
if(Math.abs(xx-river(zz))>11)stones(xx,zz,.3+hash(q*13)*1.1,q);
}
flowers();
}
function compile(type,source){
var sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);
if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));
return sh;
}
function program(v,f){
var p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,document.getElementById(v).textContent));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,document.getElementById(f).textContent));gl.linkProgram(p);
if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;
}
var sky,world;
try{sky=program('sky-vs','sky-fs');world=program('world-vs','world-fs');populate();land.upload();water.upload();trees.upload();grass.upload();}
catch(e){console.error(e);error.className='show';error.textContent='렌더 준비 중 오류: '+e.message;return;}
var vistas=[
{x:-12,y:terrain(-12,-28)+4,z:-28,yaw:.06,pitch:-.045},
{x:25,y:terrain(25,31)+4,z:31,yaw:.17,pitch:-.015},
{x:-100,y:terrain(-100,65)+6,z:65,yaw:.16,pitch:.07}
],cam={...vistas[0]},currentW=0,currentH=0,quality=innerWidth<700?1:0;
var qualityNames=['화질 · 높음','화질 · 보통','화질 · 절전'],qualityButton=document.getElementById('quality');
qualityButton.textContent=qualityNames[quality];
qualityButton.addEventListener('click',function(){quality=(quality+1)%3;qualityButton.textContent=qualityNames[quality];});
Array.from(document.querySelectorAll('[data-scene]')).forEach(function(btn){
btn.addEventListener('click',function(){
cam={...vistas[Number(btn.dataset.scene)]};
document.querySelectorAll('[data-scene]').forEach(function(b){b.classList.toggle('active',b===btn);});
});
});
var dragging=null;
canvas.addEventListener('pointerdown',function(e){dragging={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',function(e){
if(!dragging||dragging.id!==e.pointerId)return;
cam.yaw-=(e.clientX-dragging.x)*.0027;cam.pitch=clamp(cam.pitch+(e.clientY-dragging.y)*.0022,-.46,.54);
dragging.x=e.clientX;dragging.y=e.clientY;
});
['pointerup','pointercancel','lostpointercapture'].forEach(function(event){canvas.addEventListener(event,function(){dragging=null;});});
var uniformCache=new WeakMap();
function location(p,n){var o=uniformCache.get(p);if(!o){o={};uniformCache.set(p,o);}if(!(n in o))o[n]=gl.getUniformLocation(p,n);return o[n];}
function uniform1(p,n,v){var l=location(p,n);if(l!==null)gl.uniform1f(l,v);}
function uniform3(p,n,v){var l=location(p,n);if(l!==null)gl.uniform3fv(l,v);}
function setUniforms(p,time){
gl.useProgram(p);
var cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
uniform3(p,'uCam',[cam.x,cam.y,cam.z]);uniform3(p,'uForward',[sy*cp,sp,cy*cp]);uniform3(p,'uRight',[cy,0,-sy]);uniform3(p,'uUp',[-sy*sp,cp,-cy*sp]);
uniform3(p,'uSun',[-.43,.72,.53]);uniform1(p,'uFov',Math.tan(Math.PI*65/360));uniform1(p,'uAspect',currentW/currentH);uniform1(p,'uTime',time);
var loc=location(p,'uSize');if(loc!==null)gl.uniform2f(loc,currentW,currentH);
}
var vao=gl.createVertexArray(),frames=0,dt=0,last=performance.now();
function draw(now){
var dpr=Math.min(window.devicePixelRatio||1,1.65)*[1,.72,.54][quality],w=Math.max(2,Math.round(canvas.clientWidth*dpr)),h=Math.max(2,Math.round(canvas.clientHeight*dpr));
if(w!==currentW||h!==currentH){currentW=canvas.width=w;currentH=canvas.height=h;gl.viewport(0,0,w,h);}
gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.depthMask(false);
setUniforms(sky,now*.001);gl.bindVertexArray(vao);gl.drawArrays(gl.TRIANGLES,0,3);
gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.depthMask(true);
setUniforms(world,now*.001);
[[land,0],[water,1],[trees,0],[grass,2]].forEach(function(entry){uniform1(world,'uKind',entry[1]);gl.bindVertexArray(entry[0].vao);gl.drawArrays(gl.TRIANGLES,0,entry[0].count);});
frames++;dt+=Math.min(100,now-last);last=now;
if(dt>1000){var fps=Math.round(frames*1000/dt),tri=land.triangles+water.triangles+trees.triangles+grass.triangles;stats.textContent=fps+' FPS · '+Math.round(tri/1000)+'K TRI · '+w+'×'+h;window.__SERENVELT_DIAGNOSTICS__={fps:fps,triangles:tri,width:w,height:h,quality:quality};dt=0;frames=0;}
requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script></body></html>
