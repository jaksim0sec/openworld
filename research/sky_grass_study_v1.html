<script id="sky-vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
out vec2 vUv;
void main(){vec2 p=gl_VertexID==0?vec2(-1.,-1.):gl_VertexID==1?vec2(3.,-1.):vec2(-1.,3.);vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}
</script>
<script id="sky-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform vec2 uResolution;
uniform vec3 uForward,uRight,uUp,uSun;
uniform float uTanHalf,uAspect,uTime,uWarm,uCloud;
uniform sampler2D uNoise;
const float PI=3.14159265;
float noiseAt(vec2 p){return texture(uNoise,p).r;}
vec3 skyAtmosphere(vec3 d){
  float y=max(d.y,0.0);
  float cosTheta=clamp(dot(d,uSun),-1.,1.);
  float rayPhase=.75*(1.+cosTheta*cosTheta);
  float g=.76;
  float miePhase=(1.-g*g)/pow(max(.05,1.+g*g-2.*g*cosTheta),1.5);
  float optical=1.0/(.14+y*1.9);
  vec3 rayBeta=vec3(.24,.43,.9);
  vec3 scatter=(1.-exp(-rayBeta*optical*.88))*rayPhase;
  vec3 top=vec3(.065,.51,.77);
  vec3 horizon=vec3(.57,.81,.87);
  vec3 base=mix(horizon,top,pow(y,.51));
  // A direction-dependent Rayleigh component plus the forward Mie lobe.
  base+=scatter*vec3(.034,.067,.115);
  float horizonWarm=exp(-y*11.)*(.08+.15*uWarm);
  base+=vec3(1.,.71,.35)*horizonWarm*.35;
  base+=miePhase*vec3(1.,.77,.48)*(.004+.008*uWarm)*exp(-y*.5);
  return base;
}
float cloudShape(vec2 p){
 float a=noiseAt(p*.0021+vec2(.31,.17));
 float b=noiseAt(p*.0057+vec2(.43,.27));
 float c=noiseAt(p*.016+vec2(.11,.72));
 float d=noiseAt(p*.043);
 return a*.57+b*.25+c*.13+d*.05;
}
void main(){
 vec2 ndc=vUv*2.-1.;
 vec3 d=normalize(uForward+ndc.x*uRight*uTanHalf*uAspect+ndc.y*uUp*uTanHalf);
 vec3 sky=skyAtmosphere(d);
 float elev=smoothstep(.015,.15,d.y);
 vec2 plane=d.xz/(.22+max(.0,d.y));
 vec2 p=plane*3.8+vec2(3.9,6.5)+vec2(uTime*.02,uTime*.005);
 float structure=cloudShape(p);
 float band=.019*sin(p.x*.36+p.y*.21)+.012*sin(p.y*.68);
 float threshold=mix(.62,.48,uCloud);
 float alpha=smoothstep(threshold-.033,threshold+.049,structure+band)*elev;
 // Slight sampling offset follows the sun, approximating edge illumination of cloud volumes.
 float toSun=cloudShape(p+normalize(uSun.xz)*.70);
 float light=clamp(.56+(structure-toSun)*2.8+.29*uSun.y,0.,1.);
 vec3 cloudShade=mix(vec3(.60,.72,.77),vec3(1.,.968,.86),light);
 cloudShade+=vec3(.10,.065,.02)*uWarm*pow(max(dot(d,uSun),0.),5.);
 sky=mix(sky,cloudShade,clamp(alpha*.9,0.,1.));
 float sun=dot(d,uSun);
 sky+=vec3(1.,.83,.56)*pow(smoothstep(.994,1.,sun),1.5)*(.34+.15*uWarm);
 sky+=vec3(1.,.82,.54)*pow(max(sun,0.),14.)*(.018+.04*uWarm);
 fragColor=vec4(clamp(sky,0.,1.),1.);
}
</script>
<script id="land-vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
layout(location=0) in vec2 aXZ;
uniform vec3 uCam,uForward,uRight,uUp;
uniform float uTanHalf,uAspect;
out vec3 vWorld;
out vec3 vNormal;
float terrain(vec2 p){float r=length(p);float far=smoothstep(75.,230.,r);return .30*sin(p.x*.019)+.28*sin(p.y*.014+p.x*.005)+.13*sin(r*.032)+.10*sin(p.x*.083)*cos(p.y*.056)+far*(6.0*sin(p.x*.006+p.y*.002)+4.8*sin(p.y*.009-p.x*.004));}
void main(){
 vec3 pos=vec3(aXZ.x,terrain(aXZ),aXZ.y);vWorld=pos;
 float dx=(terrain(aXZ+vec2(.75,0))-terrain(aXZ-vec2(.75,0)))/1.5;
 float dz=(terrain(aXZ+vec2(0,.75))-terrain(aXZ-vec2(0,.75)))/1.5;
 vNormal=normalize(vec3(-dx,1.,-dz));
 vec3 rel=pos-uCam;float z=dot(rel,uForward);
 gl_Position=vec4(dot(rel,uRight)/(uTanHalf*uAspect),dot(rel,uUp)/uTanHalf,z*1.00024-.25,z);
}
</script>
<script id="land-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec3 vWorld,vNormal;
out vec4 fragColor;
uniform vec3 uCam,uSun;
uniform float uHaze,uWarm;
uniform sampler2D uNoise;
void main(){
 vec2 p=vWorld.xz;
 float broad=texture(uNoise,p*.0012+vec2(.21,.48)).r;
 float medium=texture(uNoise,p*.0105+vec2(.53,.17)).r;
 float fine=texture(uNoise,p*.051).r;
 float stipple=texture(uNoise,p*.195+vec2(.02,.68)).r;
 float wave=.5+.5*sin(p.x*.037+p.y*.025+broad*3.);
 float soil=smoothstep(.19,.78,broad*.50+medium*.29+wave*.21);
 vec3 dark=vec3(.21,.40,.23);
 vec3 mid=vec3(.36,.58,.31);
 vec3 bright=vec3(.61,.74,.37);
 vec3 grass=mix(dark,mid,smoothstep(.12,.92,soil));
 grass=mix(grass,bright,.30*medium+.14*wave);
 grass+=vec3(.048,.055,.014)*(fine-.5)+vec3(.019,.022,.007)*(stipple-.5);
 float ndl=max(dot(normalize(vNormal),uSun),0.);
 grass*=.70+.31*ndl;
 grass+=vec3(.095,.065,.018)*ndl*uWarm;
 float dist=distance(uCam.xz,p);
 // Aerial perspective, not a painted skyline: terrain contrast disappears with distance.
 float fog=1.-exp(-pow(dist*(.0017+uHaze*.0088),1.22));
 vec3 horizon=vec3(.54,.75,.77)+vec3(.08,.045,.005)*uWarm;
 grass=mix(grass,horizon,clamp(fog,0.,.97));
 fragColor=vec4(clamp(grass,0.,1.),1.);
}
</script>
<script id="grass-vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
precision highp int;
uniform vec3 uCam,uForward,uRight,uUp,uSun;
uniform float uTanHalf,uAspect,uTime;
out vec2 vUv;
out vec3 vTint;
out float vY,vDistance;
uint hash(uint x){x^=x>>16u;x*=0x7feb352du;x^=x>>15u;x*=0x846ca68bu;x^=x>>16u;return x;}
float rnd(uint x){return float(hash(x))*(1.0/4294967295.0);}
float terrain(vec2 p){float r=length(p);float far=smoothstep(75.,230.,r);return .30*sin(p.x*.019)+.28*sin(p.y*.014+p.x*.005)+.13*sin(r*.032)+.10*sin(p.x*.083)*cos(p.y*.056)+far*(6.0*sin(p.x*.006+p.y*.002)+4.8*sin(p.y*.009-p.x*.004));}
void main(){
 uint id=uint(gl_InstanceID)+1u;
 uint card=uint(gl_VertexID/6);
 int t=gl_VertexID%6;
 vec2 uv=t==0?vec2(0.,0.):t==1?vec2(1.,0.):t==2?vec2(0.,1.):t==3?vec2(0.,1.):t==4?vec2(1.,0.):vec2(1.,1.);
 uint seed=id*167u+card*2654435761u;
 vec2 center=(vec2(rnd(id*37u),rnd(id*71u))-0.5)*118.;
 float a=rnd(id*43u)*6.2831853+float(card)*1.5707963;
 vec2 axis=vec2(cos(a),sin(a));
 float width=mix(.40,.66,rnd(id*11u));
 float height=mix(.34,.64,rnd(id*17u));
 vec2 root=center+(vec2(rnd(seed*23u),rnd(seed*29u))-.5)*.13;
 float gust=sin(uTime*.77+center.x*.12+center.y*.08)*.64+sin(uTime*1.8+center.x*.31-center.y*.18)*.36;
 vec2 wind=vec2(.075,.053)*gust*uv.y*uv.y;
 vec2 xz=root+axis*(uv.x-.5)*width+wind;
 vec3 world=vec3(xz.x,terrain(root)+height*uv.y,xz.y);
 vec3 rel=world-uCam;float z=dot(rel,uForward);
 gl_Position=vec4(dot(rel,uRight)/(uTanHalf*uAspect),dot(rel,uUp)/uTanHalf,z*1.00024-.25,z);
 uint variant=uint(floor(rnd(id*59u)*4.));
 vec2 tile=vec2(float(variant%2u),float(variant/2u));
 vUv=(uv+tile)*.5;
 float spatial=.5+.5*sin(center.x*.027+center.y*.045);
 vTint=mix(vec3(.79,.92,.87),vec3(1.24,1.14,.79),rnd(seed*47u)*.35+spatial*.65);
 vY=uv.y;
 vDistance=distance(center,uCam.xz);
}
</script>
<script id="grass-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
in vec2 vUv;
in vec3 vTint;
in float vY,vDistance;
out vec4 fragColor;
uniform float uWarm,uHaze;
uniform sampler2D uGrassTex;
void main(){
 vec4 blade=texture(uGrassTex,vUv);
 if(blade.a<.39) discard;
 vec3 col=blade.rgb*vTint*(.76+.25*vY);
 col+=vec3(.085,.065,.007)*vY*uWarm;
 float fog=1.-exp(-pow(vDistance*(.0017+uHaze*.0088),1.22));
 col=mix(col,vec3(.54,.75,.77)+vec3(.08,.045,.005)*uWarm,clamp(fog,0.,.79));
 float fade=1.-smoothstep(42.,60.,vDistance);
 float jitter=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
 if(jitter>fade)discard;
 fragColor=vec4(clamp(col,0.,1.),1.);
}
</script>
